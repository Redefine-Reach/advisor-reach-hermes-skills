name: lint
on: { push: {}, pull_request: {} }
permissions: { contents: read }
jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: |
          python3 - <<'PY'
          import glob,re,yaml,sys
          bad=[]
          for p in glob.glob('skills/*/SKILL.md'):
              t=open(p).read()
              m=re.match(r'^---\n(.*?)\n---\n',t,re.S)
              if not m: bad.append(f'{p}: no frontmatter'); continue
              d=yaml.safe_load(m.group(1)) or {}
              if not d.get('name') or not str(d.get('description','')).strip():
                  bad.append(f'{p}: missing name/description')
          print('\n'.join(bad) or 'all skills valid'); sys.exit(1 if bad else 0)
          PY
  template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match sms-box Hermes image (see scripts/hermes-ci-source.txt); not main-tip Hermes on 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Install Hermes + telnyx_sms for production send-path test
        run: bash scripts/setup-hermes-sms-ci.sh
        env:
          HERMES_CI_ROOT: ${{ runner.temp }}/hermes-sms-ci
          HERMES_HOME: ${{ runner.temp }}/hermes-sms-ci/hermes-home
          HERMES_CI_PYTHON: "3.13"
      - run: node --test tests/*.test.mjs
        env:
          CI: "true"
          HERMES_CI_ROOT: ${{ runner.temp }}/hermes-sms-ci
          HERMES_HOME: ${{ runner.temp }}/hermes-sms-ci/hermes-home
  state-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      # Unit tests (incl. the 121-day fixture under tests/fixtures/rules), then the live files.
      - run: python -m unittest tests/test_check_state_rules.py -v
      - run: python scripts/check_state_rules.py
