name: lint
on: { push: {}, pull_request: {} }
permissions: { contents: read }
jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: |
          python3 - <<'PY'
          import glob,re,yaml,sys
          bad=[]
          for p in glob.glob('skills/*/SKILL.md'):
              t=open(p).read()
              m=re.match(r'^---\n(.*?)\n---\n',t,re.S)
              if not m: bad.append(f'{p}: no frontmatter'); continue
              d=yaml.safe_load(m.group(1)) or {}
              if not d.get('name') or not str(d.get('description','')).strip():
                  bad.append(f'{p}: missing name/description')
          print('\n'.join(bad) or 'all skills valid'); sys.exit(1 if bad else 0)
          PY
  template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          chmod 600 evals/milestone-zero/fixtures/fake_sessions/known_names.txt \
            evals/milestone-zero/fixtures/fake_sessions/forgotten.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout/known_names.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout/forgotten.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout2/known_names.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout2/forgotten.txt
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest tests/test_milestone_zero_redact.py -q
      - run: |
          cd evals/milestone-zero
          python3 check_leaks.py --label main --cwd . --strict-drop --fail-on-overredaction \
            --cmd 'python3 export_session_to_case.py --session {in} --redacted-text-out {out} --known-names {known} --rules {rules} --forgotten {forgotten} --owner-name Alex'
          python3 check_leaks.py --label heldout --cwd . --sessions fixtures/fake_sessions_heldout --strict-drop --fail-on-overredaction \
            --cmd 'python3 export_session_to_case.py --session {in} --redacted-text-out {out} --known-names {known} --rules {rules} --forgotten {forgotten} --owner-name Alex'
          python3 check_leaks.py --label heldout2 --cwd . --sessions fixtures/fake_sessions_heldout2 --strict-drop --fail-on-overredaction \
            --cmd 'python3 export_session_to_case.py --session {in} --redacted-text-out {out} --known-names {known} --rules {rules} --forgotten {forgotten} --owner-name Alex'
          # Optional private unseen set (not in repo): MZ_PRIVATE_LEAK_SESSIONS=/path/to/dir
  state-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: |
          chmod 600 evals/milestone-zero/fixtures/fake_sessions/known_names.txt \
            evals/milestone-zero/fixtures/fake_sessions/forgotten.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout/known_names.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout/forgotten.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout2/known_names.txt \
            evals/milestone-zero/fixtures/fake_sessions_heldout2/forgotten.txt
      # Unit tests (incl. the 121-day fixture under tests/fixtures/rules), then the live files.
      - run: python3 -m unittest tests/test_check_state_rules.py tests/test_milestone_zero_redact.py -v
      - run: python3 scripts/check_state_rules.py
