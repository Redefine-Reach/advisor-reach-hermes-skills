    hours.
  trigger: license expiration date
  offset_days: 0
  offset_direction: before
  calendar_or_business_days: null
  reminder_text: 'Reminder: ADRE''s education page says renewal applications on or after January 1, 2025
    include one hour each on Firewise, deed fraud, and Arizona water. The administrative-code reprint
