# Arizona state rules for ARIN reminders. Reviewed draft; merge needs David.
state: AZ
version: 1
status: reviewed-draft
last_checked: '2026-10-12'
disclaimer: Reminders of published text only, not legal advice. Contract-term reminders reflect the standard
  Arizona REALTORS purchase contract (Feb 2026); a signed contract or counteroffer can change the days.
source_policy:
  statute_and_adre_rules: at least 2 sources, at least 1 official (A.R.S., A.A.C., ADRE, or CFR)
  contract_terms: 'source_type standard_contract_form (CI: exactly 1 source allowed, caveat field required); single source allowed: current Arizona REALTORS form edition, labeled "standard contract
    form, Feb 2026" (Jerry, 2026-10-12)'
provenance:
  dataset: https://github.com/Redefine-Reach/research-director/pull/9
