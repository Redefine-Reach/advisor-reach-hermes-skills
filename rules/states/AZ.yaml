    facts apply. The statute still says at least seven days before the transfer. These days apply under
    the standard AZ purchase contract; check your signed contract, since counteroffers can change the
    days.'
  applies_to: seller-side
  source_type: standard_contract_form
  source_edition: Feb 2026
