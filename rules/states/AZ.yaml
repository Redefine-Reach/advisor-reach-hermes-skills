rules:
- id: az-license-term-two-years
  category: license_renewal
  title: Original and renewal license periods are two years
  plain_rule: An original Arizona real estate license runs for two years through the last day of the month
    it was granted, and a renewed license runs for two years beginning the day after the previous license
    expires.
  trigger: license expiration date
  offset_days: null
  offset_direction: null
  calendar_or_business_days: null
  reminder_text: 'Reminder: the license period on an Arizona real estate license is two years, and a renewed
    license period starts the day after the previous expiration date.'
  applies_to: agent
  source_type: statute
  sources:
  - url: https://www.azleg.gov/viewdocument/?docName=https://www.azleg.gov/ars/32/02129.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2129. Advance payment of license fees
    quoted_text: An original license shall be for a period of two years up to and including the last day
      of the month in which the license was granted. A renewal license shall be effective as of the date
      of issuance, but no earlier than the first day after the expiration of the previous license. Regardless
      of the date of issuance, the renewed license is for a two year period beginning on the first day
      after the expiration of the previous license.
    retrieved_date: '2026-10-12'
  - url: https://www.azleg.gov/ars/32/02130.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2130. Renewal of licenses; education requirements
    quoted_text: The total number of credit hours shall be accrued at a rate of twenty-four credit hours
      for salespersons and associate brokers and thirty credit hours for designated brokers or for associate
      brokers employed by a designated broker pursuant to section 32-2151.01, subsection G during each
      twenty-four-month period of licensure.
    retrieved_date: '2026-10-12'
  effective_date: null
  last_verified: '2026-10-12'
  last_checked: '2026-10-12'
  verification_note: "Fact-check 2026-10-12: effective date left null. Laws 2010 ch. 166 (SB 1219) only changed the renewal term in 32-2129(C) and the original enactment wasn't found."
  confidence: high
  notes: The two-year length is stated in A.R.S. § 32-2129(C). Section 32-2130(A) independently describes
    licensure in twenty-four-month periods. The expiration date printed on the license is the date the
    two-year period ends. Original licenses end on the last day of the issuance month.
- id: az-license-timely-renewal-on-expiration-date
  category: license_renewal
  title: Timely renewal is due by the expiration date
  plain_rule: A renewal application filed after the license expiration date is a late renewal, and ADRE
    tells licensees to file before the end of the month in which the license expires.
  trigger: license expiration date
  offset_days: 0
  offset_direction: before
  calendar_or_business_days: null
  reminder_text: 'Reminder: a renewal filed after the license expiration date is a late renewal. The expiration
    date is the last day of that license period.'
  applies_to: agent
  source_type: ADRE rule (A.A.C.) + ADRE
  sources:
  - url: https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-28-303
    publisher: Legal Information Institute, Cornell Law School
    title: Ariz. Admin. Code R4-28-303(B). Late renewal
    quoted_text: Late renewal. In addition to the information required in subsection (A), any person applying
      for renewal after the date of license expiration shall specify whether the person conducted unlawful
      license activities as described in R4-28-306.
    retrieved_date: '2026-10-12'
  - url: https://azre.gov/divisions/licensing/how-obtain-license
    publisher: Arizona Department of Real Estate
    title: How to Obtain a License
    quoted_text: License renewal must occur on or before the last day of the month in which the license
      was issued.
    retrieved_date: '2026-10-12'
  effective_date: '2025-12-13'
  last_verified: '2026-10-12'
  last_checked: '2026-10-12'
  verification_note: 'Effective date: current R4-28-303 section, 31 A.A.R. 4267, effective Dec 13, 2025 (SOS pamphlet Supp. 26-2). Section date, not proven to be the first date of subsection (B).'
  confidence: high
  notes: Offset 0 before the expiration date means the reminder lands on the expiration date, not the
    day before. R4-28-303(B) calls an application after the expiration date a late renewal. A.R.S. § 32-2129(C)
    places the end of an original license on the last day of the issuance month, which matches ADRE's
    'end of the month' wording. The Cornell page is a reprint of the rule; its amendment note ends with
    the March 5, 2005 rulemaking. The late-versus-timely distinction in subsection (B) was the text retrieved.
    ADRE's verb on the FAQ is 'encouraged' for filing early; the rule, not that verb, is what marks an
    application after the expiration date as late. The ADRE FAQ URL azre.gov/where-do-i-renew-my-license
    returned 404 on 2026-10-12 and was replaced with the live ADRE "How to Obtain a License" page.
- id: az-license-no-practice-while-expired
  category: license_renewal
  title: License rights stop on the expiration date
  plain_rule: Between the expiration date and the date of renewal, the license rights expire and it is
    unlawful to act or offer to act as a real estate broker or salesperson.
  trigger: license expiration date
  offset_days: 0
  offset_direction: after
  calendar_or_business_days: null
  reminder_text: 'Reminder: on the day after the license expiration date, the license rights are expired
    until the renewal is issued. Expired status is not a period in which licensed activity is lawful.'
  applies_to: agent
  source_type: statute + ADRE
  sources:
  - url: https://www.azleg.gov/ars/32/02130.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2130(F)
    quoted_text: Between the expiration date of the license and the date of renewal of the license, the
      rights of the licensee under the license expire. While the license is expired it is unlawful for
      a person to act or attempt or offer to act in a manner included in the definition of a real estate
      broker or real estate salesperson, a timeshare salesperson, a cemetery broker or cemetery salesperson
      or a membership camping broker or membership camping salesperson.
    retrieved_date: '2026-10-12'
  - url: https://www.azleg.gov/legtext/50leg/2r/laws/0239.htm
    publisher: Arizona State Legislature
    title: Laws 2012, ch. 239, amending A.R.S. § 32-2130(F) (effective from and after January 1, 2013)
    quoted_text: Between the expiration date of the license and the date of renewal of the license, the
      rights of the licensee under the license expire. While the license is expired it is unlawful for
      a person to act or attempt or offer to act in a manner included in the definition of a real estate,
      cemetery or membership camping broker or salesperson.
    retrieved_date: '2026-10-12'
  effective_date: '2013-01-01'
  last_verified: '2026-10-12'
  last_checked: '2026-10-12'
  confidence: high
  notes: This is the point that keeps the one-year renewal window from being described as a grace period
    to practice. If an employing broker's license expires, A.R.S. § 32-2130(F) also severs the licenses
    of persons employed by that broker on the broker's expiration date. The ADRE FAQ's phrase about review
    of the renewal application is narrower than the statute, which ties the return of license rights to
    renewal of the license. The ADRE FAQ URL returned 404 on 2026-10-12 and was replaced with A.R.S. §
    the Laws 2012 ch. 239 text of § 32-2130(F). Citation is A.R.S. § 32-2130(F), effective 2013-01-01;
    § 32-2122(B) was removed because it bans practice without first obtaining a license and says nothing
    about expiration (fact-check 2026-10-12). Caution - the azleg.gov § 32-2130 page currently prints
    wording from Laws 2026, ch. 220 (adding timeshare salesperson), which is effective only from and after
    June 30, 2027; the source 1 quote above is that future wording, and the in-force list is the Laws 2012/2024
    wording in source 2.
- id: az-license-late-renewal-one-year-window
  category: license_renewal
  title: Late renewal without an examination stays open for one year
  plain_rule: The Department renews an expired license without an examination when the renewal is not
    more than one year after the expiration date and the license was not canceled or suspended at expiration,
    and it terminates a license that has been expired for more than one year.
  trigger: license expiration date
  offset_days: null
  offset_period: 1 year
  offset_direction: after
  calendar_or_business_days: null
  reminder_text: 'Reminder: the window to renew an expired Arizona real estate license without an examination
    runs for one year after the expiration date. A license expired for more than one year is terminated.
    The window does not authorize practice while the license is expired.'
  applies_to: agent
  source_type: statute
  sources:
  - url: https://www.azleg.gov/ars/32/02130.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2130(F) and (G)
    quoted_text: The department shall terminate a license that has been expired for more than one year.
      … Except as provided in section 32-4301, not more than one year after the license expiration date,
      the department shall renew a license without requiring the applicant to submit to an examination
      if the applicant held a license that was not canceled or suspended at the time of expiration.
    retrieved_date: '2026-10-12'
  - url: https://www.azleg.gov/ars/32/02124.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2124(I)
    quoted_text: A renewal applicant for a real estate broker's, cemetery broker's or membership camping
      broker's or real estate salesperson's, cemetery salesperson's, membership camping salesperson's
      or timeshare salesperson's license is not required to submit to an examination if the application
      is made within twelve months after the license expires and the license is not canceled, terminated
      or suspended at the time of application.
    retrieved_date: '2026-10-12'
  effective_date: '2013-01-01'
  last_verified: '2026-10-12'
  last_checked: '2026-10-12'
  verification_note: "Effective date: one-year window is in Laws 2012, ch. 239, effective from and after Jan 1, 2013; current (G) wording from Laws 2024, ch. 52 (Sep 14, 2024). The 12-month exam waiver is § 32-2124(H) until Laws 2026 ch. 220 renumbers it (I) after June 30, 2027."
  confidence: medium
  notes: Both sections use a one-year or twelve-month length. They do not use the same status test. Section
    32-2130(G) looks at whether the license was canceled or suspended at the time of expiration. Section
    32-2124(I) looks at whether the license is canceled, terminated, or suspended at the time of application.
    Stored as offset_period "1 year" (offset_days null) rather than 365 days for 'one year' and 'twelve
    months'; neither subsection says 365 days, and a one-year anniversary can fall on day 365 or 366.
    Section 32-2130(G) also says the renewed period starts the day after the old expiration date. Section
    32-4301 is an exception that was not opened for this dataset. There is no statutory grace period that
    authorizes practice after expiration; see az-license-no-practice-while-expired.
- id: az-license-late-renewal-fee
  category: license_renewal
  title: ADRE fee table lists a higher late-renewal fee
  plain_rule: The ADRE fee table lists a salesperson timely renewal at $60 and a late renewal at $125,
    and a broker timely renewal at $120 and a late renewal at $245.
  trigger: license expiration date
  offset_days: 0
  offset_direction: after
  calendar_or_business_days: null
  reminder_text: 'Reminder: the ADRE fee table shows a higher renewal fee after the license is expired.
    Confirm the current timely and late amounts on the ADRE fee page before paying, because the statute
    sets maximums rather than these exact figures.'
  applies_to: agent
  source_type: statute + ADRE
  sources:
  - url: https://azre.gov/all-adre-resources/fees
    publisher: Arizona Department of Real Estate
    title: Fees
    quoted_text: INDIVIDUAL LICENSE RENEWAL & REINSTATEMENT. Salesperson Timely Renewal $60. Salesperson
      Late Renewal $125. Broker Timely Renewal $120. Broker Late Renewal $245. Reinstatement per A.R.S.
      §32-2131 $5 for salesperson and $5 for broker.
    retrieved_date: '2026-10-12'
  - url: https://www.azleg.gov/ars/32/02132.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2132(A)(4) and (A)(8)
    quoted_text: A broker's renewal fee of not more than $400. … A salesperson's renewal fee of not more
      than $200.
    retrieved_date: '2026-10-12'
  effective_date: null
  last_verified: '2026-10-12'
  status: drop
  last_checked: '2026-10-12'
  verification_note: 'DROP: no effective or revision date found for the ADRE fee amounts ($60/$125/$120/$245) on azre.gov/all-adre-resources/fees or in a dated fee schedule or SPS (fact-check 2026-10-12 plus retry).'
  confidence: low
  notes: The dollar split between timely and late renewal was found only on the ADRE fee table retrieved
    2026-10-12. A.R.S. § 32-2132 does not state $60, $125, $120, or $245. It caps a broker renewal at
    not more than $400 and a salesperson renewal at not more than $200, and it sets a $5 reinstatement
    fee within the license period, which the fee table also lists under A.R.S. § 32-2131. Those caps are
    consistent with the table and do not independently confirm the timely-versus-late amounts. The quoted
    fee-table text is the table contents as read, not a single statutory sentence. A school webpage repeated
    the same amounts and was not used as a second source.
- id: az-ce-salesperson-24-hours
  category: continuing_ed
  title: Salesperson renewal education total is 24 credit hours
  plain_rule: A salesperson renewing an active license presents 24 credit hours of approved continuing
    education taken during the preceding license period, which is each twenty-four-month period of licensure.
  trigger: license expiration date
  offset_days: 0
  offset_direction: before
  calendar_or_business_days: null
  reminder_text: 'Reminder: the salesperson renewal total in statute and rule is 24 credit hours accrued
    during the twenty-four-month license period that ends on the expiration date.'
  applies_to: agent
  source_type: statute + ADRE rule (A.A.C.)
  sources:
  - url: https://www.azleg.gov/ars/32/02130.htm
    publisher: Arizona State Legislature
    title: A.R.S. § 32-2130(A)
    quoted_text: a license may be renewed in a timely manner by filing an application for renewal in the
      manner prescribed by the commissioner, by paying the renewal fee specified in this chapter and by
      presenting evidence of attendance at a school certified by the commissioner during the preceding
      license period of twenty-four credit hours for salespersons and associate brokers and thirty credit
      hours for designated brokers or for associate brokers employed by a designated broker pursuant to
      section 32-2151.01, subsection G
    retrieved_date: '2026-10-12'
  - url: https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-28-402
    publisher: Legal Information Institute, Cornell Law School
    title: Ariz. Admin. Code R4-28-402(A)(2)
    quoted_text: A real estate salesperson or associate broker applying for renewal shall submit proof
      of satisfactory completion of 24 credit hours of continuing education courses in the categories
      specified in subsection (A)(5).
    retrieved_date: '2026-10-12'
  effective_date: '2013-01-01'
  last_verified: '2026-10-12'
  last_checked: '2026-10-12'
  verification_note: 'Effective date: 24-hour salesperson total is in Laws 2012, ch. 239, effective from and after Jan 1, 2013; R4-28-402 last amended effective Dec 13, 2025.'
  confidence: high
  notes: The 24-hour total for salespersons agrees in the statute and the rule reprint. The same statute
    places ordinary associate brokers in the 24-hour group and places designated brokers, and associate
    brokers employed under A.R.S. § 32-2151.01(G), in a 30-hour group. The rule reprint still says a designated
    broker submits 24 hours. That conflict is a separate low-confidence item. Inactive status under §
    32-2130(K) does not require continuing education during the inactive period. The commissioner may
    waive hours for good cause under § 32-2130(A) and R4-28-402(B). An AAR December 4, 2025 handout shows
    added rule text allowing some courses completed within 90 days of a renewal to count toward the next
    period; that sentence was not confirmed in the Secretary of State pamphlet and is not used as a deadline
    here.
- id: az-ce-six-category-minimums
  category: continuing_ed
  title: Eight continuing-education categories each have a three-hour minimum
  plain_rule: A.A.C. R4-28-402(A)(2), effective December 13, 2025, requires at least three hours in each
    of the categories in (A)(5)(a) through (A)(5)(h) - agency law, contract law, requirements for licensees,
    real estate legal issues, fair housing, disclosure, business brokerage, and general real estate.
  trigger: license expiration date
  offset_days: 0
  offset_direction: before
  calendar_or_business_days: null
  reminder_text: 'Reminder: renewal education is tracked by category. The published rule text requires
    a minimum of three hours in each of the eight categories (a) through (h) of R4-28-402(A)(5).'
  applies_to: agent
  source_type: ADRE rule (A.A.C.)
  sources:
  - url: https://web.archive.org/web/20260727013006/https://apps.azsos.gov/public_services/Title_04/4-28.pdf
    publisher: Arizona Secretary of State (A.A.C. Title 4, Ch. 28, Supp. 26-2, archived copy)
    title: Ariz. Admin. Code R4-28-402(A)(2), effective December 13, 2025 (31 A.A.R. 4267)
    quoted_text: The renewal applicant shall complete a minimum of three hours in each category under
      subsections (A)(5)(a) through (A)(5)(h).
    retrieved_date: '2026-10-12'
  - url: https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-28-402
    publisher: Legal Information Institute, Cornell Law School
    title: Ariz. Admin. Code R4-28-402(A)(2) and (A)(5)
    quoted_text: 'The renewal applicant shall complete a minimum of three hours in each of the mandatory
      categories under subsections (A)(5)(a) through (A)(5)(f). The renewal applicant shall take additional
      courses in the mandatory categories, or shall take courses in the business brokerage or general
      real estate categories described in subsection (A)(5)(g) and (A)(5)(h) to fulfill the required 24
      credit hours. a. Agency law. The majority of class material concerns agency relationships and disclosure.
      b. Contract law. The majority of class material concerns the contract formation and implementation,
      or the results of contract use, including: c. Commissioner''s standards. The majority of class material
      relates to license laws, including: d. Real estate legal issues. The majority of class material
      concerns existing real estate law, including: e. Fair housing. The majority of class material concerns
      equal opportunities in housing, including: f. Disclosure. The majority of class material concerns
      the following:'
    retrieved_date: '2026-10-12'
  - url: https://cld.bz/users/user-86012137314/ADRE-LAW-BOOK-2025/188
    publisher: ADRE Law Book 2025, page image
    title: ADRE Law Book 2025, page 188, reprint of R4-28-402(A)(2)
    quoted_text: A real estate salesperson or associate broker applying for renewal shall submit proof
      of satisfactory completion of 24 credit hours of continuing education courses in the categories
      specified in subsection (A)(5). The renewal applicant shall complete a minimum of three hours in
      each of the mandatory categories under subsections (A)(5)(a) through (A)(5)(f).
    retrieved_date: '2026-10-12'
  effective_date: '2025-12-13'
  last_verified: '2026-10-12'
  last_checked: '2026-10-12'
  confidence: medium
  notes: Corrected 2026-10-12 to the current R4-28-402 (effective Dec 13, 2025), which requires three
    hours in each of categories (a) through (h) - not six categories. The Cornell and 2025 Law Book reprints
    below show the superseded (a)-(f) text and are kept only as history; 'commissioner's standards' is
    not in the current list. Paraphrased quote in source 1 is from the fact-check reading of the pamphlet.
- id: az-ce-firewise-deed-fraud-water
