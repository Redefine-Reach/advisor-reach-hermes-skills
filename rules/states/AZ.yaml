- id: az-rpc-day-count
  category: other
  title: Contract days are calendar days, and the start day is excluded
  plain_rule: The February 2026 Residential Resale Real Estate Purchase Contract says every reference
    to days is a calendar day, the day of the triggering act is not counted, and the last day is counted.
  trigger: contract acceptance date
  offset_days: null
  offset_direction: null
  calendar_or_business_days: calendar
  reminder_text: 'Reminder: day counts printed in the February 2026 purchase contract are calendar days.
    The day of the triggering event is not counted, and the last day of the period is counted. These days
    apply under the standard AZ purchase contract; check your signed contract, since counteroffers can
    change the days.'
  applies_to: both
  source_type: standard_contract_form
  source_edition: Feb 2026
  caveat: 'These days come from the standard Arizona REALTORS purchase contract (Feb 2026). Check your signed contract, since a counteroffer or addendum can change them.'
  sources:
  - url: https://www.aaronline.com/wp-content/uploads/2026/02/02/Residential-Resale-Real-Estate-Purchase-Contract-Form-February-2026-PROOF-SampleProt-1.pdf
    publisher: Arizona Association of REALTORS
    title: Residential Resale Real Estate Purchase Contract, updated February 2026, sample PDF
    quoted_text: 'Days: All references to days in this Contract shall be construed as calendar days and
      a day shall begin at 12:00 a.m. and end at 11:59 p.m. Calculating Time Periods: In computing any
      time period prescribed or allowed by this Contract, the day of the act or event from which the time
      period begins to run is not included and the last day of the time period is included.'
    retrieved_date: '2026-10-12'
  effective_date: 2026-02
  last_checked: '2026-10-12'
  last_verified: '2026-10-12'
  confidence: medium
  notes: 'The calendar-day sentence and the exclude-the-start-day sentence were read in both the February
    2026 sample and the August 2024 final. The February 2026 filename contains PROOF. The AAR forms index
    retrieved the same day lists ''Residential Resale Real Estate Purchase Contract (RPC) – February 2026''
    as the current sample. Contract acceptance occurs on the date the signed contract and any incorporated
    counteroffer is delivered to and received by the appropriate broker. Acts that must be performed three
    days prior to the close-of-escrow date must be performed three full days prior. Where a printed day
    count is followed by a blank, text extraction showed a gap (''ten (10) days or days''); the underscore
    in other quotes stands for that blank line on the form. R4-28-102, which can exclude intermediate
    weekends for periods under 11 days in the Commissioner''s rules, is a rule of ADRE procedure and is
    not the purchase contract''s counting rule. Source policy (Jerry, 2026-10-12): contract-term rule;
    the current Arizona REALTORS form edition (Feb 2026) is the single source. The Aug 2024 edition was
    removed as a non-independent second source.'
- id: az-rpc-earnest-money-deposit
  category: contract_deadline
  title: Earnest money is deposited upon acceptance
  plain_rule: On the February 2026 and August 2024 purchase contracts, earnest money, if any, is deposited
    upon acceptance with the escrow company or the broker's trust account, as checked on the form.
  trigger: contract acceptance date
  offset_days: 0
  offset_direction: after
